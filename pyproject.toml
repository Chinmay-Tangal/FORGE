[project]
name = "forge"
version = "0.2.0"
description = "A terminal-native, privacy-first agentic coding assistant for local LLMs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Forge Contributors" }]
requires-python = ">=3.10"
keywords = ["ai", "llm", "agent", "coding", "cli", "local"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
docker = [
    # No extra deps needed; uses subprocess docker CLI
]
vector = [
    # Future: sqlite-vec or chromadb for real semantic search
    # "chromadb>=0.5",
]

[project.scripts]
forge = "forge.cli.main:main"

[project.urls]
Homepage  = "https://github.com/Chinmay-Tangal/FORGE"
Repository = "https://github.com/Chinmay-Tangal/FORGE"

[build-system]
requires      = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict         = false
ignore_missing_imports = true
